security:
  password_hashers:
    App\Entity\User:
      algorithm: auto

  role_hierarchy:
    ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_TECHNICIAN, ROLE_RECEPTION, ROLE_USER]
    ROLE_ADMIN: [ROLE_TECHNICIAN, ROLE_RECEPTION, ROLE_USER]

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    login:
      pattern: ^/api/auth/login
      stateless: true
      provider: app_user_provider
      user_checker: App\Security\UserChecker
      json_login:
        check_path: /api/auth/login
        username_path: email
        password_path: password
        success_handler: App\Security\LoginSuccessHandler
        failure_handler: App\Security\LoginFailureHandler

    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      user_checker: App\Security\UserChecker
      jwt: ~

  access_control:
    # PUBLIC
    - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/forgot-password, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/reset-password, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }

    # BUSINESS ROUTES
    - { path: ^/api/users, roles: [ROLE_ADMIN, ROLE_SUPER_ADMIN] }
    - { path: ^/api/clients, roles: [ROLE_SUPER_ADMIN, ROLE_ADMIN, ROLE_RECEPTION] }
    - { path: ^/api/equipment-, roles: [ROLE_SUPER_ADMIN, ROLE_ADMIN, ROLE_RECEPTION] }

    # AUTHENTICATED
    - { path: ^/api/auth/logout, roles: IS_AUTHENTICATED_FULLY }

    # FALLBACK
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }