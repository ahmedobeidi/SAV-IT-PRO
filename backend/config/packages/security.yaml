security:
  password_hashers:
    App\Entity\User:
      algorithm: auto

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    login:
      pattern: ^/api/auth/login
      stateless: true
      provider: app_user_provider
      json_login:
        check_path: /api/auth/login
        username_path: email
        password_path: password
        success_handler: App\Security\LoginSuccessHandler
        failure_handler: App\Security\LoginFailureHandler

    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      jwt: ~
      user_checker: App\Security\UserChecker

  access_control:
    - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/forgot-password, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/reset-password, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/logout, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
