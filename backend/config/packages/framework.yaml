# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    rate_limiter:
        api:
            policy: 'fixed_window'
            limit: 120
            interval: '1 minute'

        login:
            policy: 'fixed_window'
            limit: 10
            interval: '1 minute'

        forgot_password:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        reset_password:
            policy: 'fixed_window'
            limit: 10
            interval: '15 minutes'

        refresh_token:
            policy: 'fixed_window'
            limit: 20
            interval: '5 minutes'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file